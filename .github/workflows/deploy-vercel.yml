name: Deploy to Vercel

# Vercel 프로젝트를 CLI 로 만들고(없으면) 프로덕션 배포 + seroai.xyz 도메인 연결.
# 자동 발행 커밋은 GITHUB_TOKEN 으로 푸시돼 push 이벤트가 안 생기므로 workflow_run 으로도 배포한다.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Blog Posts + Social"]
    types: [completed]

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAW_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: deadletter
      SITE_DOMAIN: seroai.xyz
    steps:
      - name: Check token
        id: token
        run: |
          # 붙여 넣을 때 섞인 공백·줄바꿈·따옴표 제거
          T=$(printf '%s' "$RAW_VERCEL_TOKEN" | tr -d '[:space:]"'"'"'')
          if [ -z "$T" ]; then
            echo "VERCEL_TOKEN 시크릿이 없어 배포를 건너뜁니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$T"
          # 토큰 값은 출력하지 않고 형식만 진단
          dashes=$(printf '%s' "$T" | tr -cd '-' | wc -c); unders=$(printf '%s' "$T" | tr -cd '_' | wc -c)
          uuid=$(printf '%s' "$T" | grep -Eqi '^[0-9a-f]{8}-[0-9a-f]{4}-' && echo 예 || echo 아니오)
          echo "토큰 형식: 길이 ${#T}, '-' ${dashes}개, '_' ${unders}개, UUID 형태: ${uuid}"
          echo "VERCEL_TOKEN=$T" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (latest main)
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        if: steps.token.outputs.ok == 'true'
        run: npm install --global vercel@latest

      - name: Link project (create if missing)
        if: steps.token.outputs.ok == 'true'
        run: vercel link --yes --project "$VERCEL_PROJECT"

      - name: Deploy (Vercel 원격 빌드, 소스를 tgz 하나로 업로드)
        if: steps.token.outputs.ok == 'true'
        run: |
          # 무료 플랜은 하루 업로드 파일 수 제한(5000)이 있어 --prebuilt 대신 원격 빌드 + 압축 업로드
          url=$(vercel deploy --prod --yes --archive=tgz)
          echo "배포 주소: $url"

      - name: Attach domain
        if: steps.token.outputs.ok == 'true'
        continue-on-error: true
        run: |
          vercel domains add "$SITE_DOMAIN" "$VERCEL_PROJECT" || true
          vercel domains add "www.$SITE_DOMAIN" "$VERCEL_PROJECT" || true
          vercel domains inspect "$SITE_DOMAIN" || true

      - name: Smoke test
        if: steps.token.outputs.ok == 'true'
        continue-on-error: true
        run: |
          sleep 20
          curl -sS -o /dev/null -w "https://$SITE_DOMAIN → %{http_code}\n" "https://$SITE_DOMAIN/"
