name: Daily Blog Posts + Social

on:
  schedule:
    # 하루 4회 시간대별 발행 (한국시간 기준)
    - cron: '0 22 * * *'    # 07:00 KST - 오전 슬롯 (finance, insurance)
    - cron: '30 3 * * *'    # 12:30 KST - 점심 슬롯 (health, tech)
    - cron: '0 9 * * *'     # 18:00 KST - 저녁 슬롯 (realestate, lifestyle)
    - cron: '30 12 * * *'   # 21:30 KST - 야간 슬롯 (mixed)
  workflow_dispatch:
    inputs:
      slot:
        description: '발행 슬롯'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - lunch
          - evening
          - night
          - all
      count:
        description: '글 수 (슬롯 설정 덮어씀, 비워두면 슬롯 기본값)'
        required: false
        default: ''
      social_only:
        description: '소셜 미디어만 발행 (블로그 스킵)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic python-dotenv

      # ── 블로그 글 발행 ──
      - name: Generate and publish blog posts
        if: ${{ github.event.inputs.social_only != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_REPO_PATH: ${{ github.workspace }}
          BLOG_SITE_URL: https://seroai.xyz
          # 키워드 발굴 (없어도 자동완성만으로 동작)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: |
          cd scripts
          SLOT="${{ github.event.inputs.slot || 'auto' }}"
          # 정기 실행은 GitHub 지연으로 몇 시간 늦게 시작될 수 있어, 실행 시각이 아니라 어떤 예약인지로 슬롯을 정한다
          case "${{ github.event.schedule }}" in
            "0 22 * * *") SLOT=morning ;;
            "30 3 * * *") SLOT=lunch ;;
            "0 9 * * *") SLOT=evening ;;
            "30 12 * * *") SLOT=night ;;
          esac
          echo "슬롯: $SLOT (event=${{ github.event_name }}, schedule='${{ github.event.schedule }}')"
          COUNT="${{ github.event.inputs.count || '' }}"
          CMD="python daily_publish.py --slot $SLOT"
          if [ -n "$COUNT" ]; then CMD="$CMD --count $COUNT"; fi
          $CMD

      - name: Commit and push blog posts
        if: ${{ github.event.inputs.social_only != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/*.mdx
          git add -f scripts/publish_history.json || true
          git add -f scripts/keyword_cache.json || true
          git add -f scripts/news_seen.json || true
          SLOT_LABEL=$(TZ=Asia/Seoul date +%H:%M)
          git diff --staged --quiet || git commit -m "feat: 자동 발행 $(date +%Y-%m-%d) ${SLOT_LABEL}"
          git pull --rebase origin main || true
          git push

      - name: Submit URLs to search engines (IndexNow)
        if: ${{ github.event.inputs.social_only != 'true' }}
        continue-on-error: true
        run: |
          cd scripts
          python submit_urls.py --new-only

      # ── 소셜 미디어 발행 (쓰레드 + 인스타그램) ──
      - name: Publish to Threads & Instagram
        # 토큰이 없거나 실패해도 QC 등 뒤 단계는 계속
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_REPO_PATH: ${{ github.workspace }}
          BLOG_SITE_URL: https://seroai.xyz
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          cd scripts
          COUNT="${{ github.event.inputs.count || '3' }}"
          python social_publish.py --count $COUNT

      - name: Commit social history
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scripts/social_history.json || true
          git diff --staged --quiet || git commit -m "chore: 소셜 발행 이력 업데이트 $(date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true

      # ── QC ──
      - name: QC - 최근 포스트 품질 검사
        if: ${{ github.event.inputs.social_only != 'true' }}
        continue-on-error: true
        run: |
          cd scripts
          python daily_publish.py --qc --qc-days 3
